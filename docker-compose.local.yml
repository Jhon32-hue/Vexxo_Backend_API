x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
    secrets:
      - local_ca
  working_dir: /app
  volumes:
    - ./:/app
    - vexxo_local_runtime:/app/.runtime
  depends_on:
    db:
      condition: service_healthy
  environment: &backend-env
    DJANGO_SECRET_KEY: ${VEXXO_LOCAL_DJANGO_SECRET_KEY:-change-me-local-only}
    JWT_SIGNING_KEY: ${VEXXO_LOCAL_JWT_SIGNING_KEY:-}
    JWT_ACTIVE_KEY_VERSION: ${VEXXO_LOCAL_JWT_ACTIVE_KEY_VERSION:-v1}
    JWT_SIGNING_KEYS_JSON: ${VEXXO_LOCAL_JWT_SIGNING_KEYS_JSON:-{}}
    IDENTITY_RECOVERY_HASH_KEY: ${VEXXO_LOCAL_IDENTITY_RECOVERY_HASH_KEY:-}
    MFA_RECOVERY_HASH_KEY: ${VEXXO_LOCAL_MFA_RECOVERY_HASH_KEY:-}
    DOCUMENTS_SCANNER_BACKEND: ${VEXXO_LOCAL_DOCUMENTS_SCANNER_BACKEND:-basic}
    DOCUMENTS_CLAMAV_HOST: ${VEXXO_LOCAL_DOCUMENTS_CLAMAV_HOST:-}
    DOCUMENTS_DELETED_RETENTION_DAYS: ${VEXXO_LOCAL_DOCUMENTS_DELETED_RETENTION_DAYS:-30}
    SECURITY_THROTTLE_HASH_KEY: ${VEXXO_LOCAL_SECURITY_THROTTLE_HASH_KEY:-}
    SECURITY_ENCRYPTION_ACTIVE_KEY_VERSION: ${VEXXO_LOCAL_SECURITY_ENCRYPTION_ACTIVE_KEY_VERSION:-}
    SECURITY_ENCRYPTION_KEYS_JSON: ${VEXXO_LOCAL_SECURITY_ENCRYPTION_KEYS_JSON:-{}}
    ENV: local
    DEBUG: ${VEXXO_LOCAL_DEBUG:-true}
    ALLOWED_HOSTS: ${VEXXO_LOCAL_ALLOWED_HOSTS:-127.0.0.1,localhost,api}
    CORS_ALLOW_ALL_ORIGINS: ${VEXXO_LOCAL_CORS_ALLOW_ALL_ORIGINS:-true}
    CORS_ALLOWED_ORIGINS: ${VEXXO_LOCAL_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
    CSRF_TRUSTED_ORIGINS: ${VEXXO_LOCAL_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: db
    DB_NAME: ${VEXXO_LOCAL_DB_NAME:-vexxo}
    DB_USER: ${VEXXO_LOCAL_DB_USER:-vexxo}
    DB_PASSWORD: ${VEXXO_LOCAL_DB_PASSWORD:-vexxo-local}
    DB_PORT: "5432"
    DB_CONN_MAX_AGE: ${VEXXO_LOCAL_DB_CONN_MAX_AGE:-0}
    LOG_LEVEL: ${VEXXO_LOCAL_LOG_LEVEL:-INFO}
    APP_FRONTEND_URL: ${VEXXO_LOCAL_APP_FRONTEND_URL:-http://localhost:3000}
    IDENTITY_PASSWORD_RESET_FRONTEND_URL: ${VEXXO_LOCAL_IDENTITY_PASSWORD_RESET_FRONTEND_URL:-http://localhost:3000/reset-password}
    IDENTITY_PASSWORD_RESET_ALLOWED_HOSTS: ${VEXXO_LOCAL_IDENTITY_PASSWORD_RESET_ALLOWED_HOSTS:-localhost,127.0.0.1}
    OPEN_BANKING_WEBHOOK_TOLERANCE_SECONDS: ${VEXXO_LOCAL_OPEN_BANKING_WEBHOOK_TOLERANCE_SECONDS:-300}
    OPEN_BANKING_EXTERNAL_PAYLOAD_TTL_DAYS: ${VEXXO_LOCAL_OPEN_BANKING_EXTERNAL_PAYLOAD_TTL_DAYS:-30}
    OPEN_BANKING_PAYLOAD_MAX_ATTEMPTS: ${VEXXO_LOCAL_OPEN_BANKING_PAYLOAD_MAX_ATTEMPTS:-5}
    OPEN_BANKING_SYNC_MAX_ATTEMPTS: ${VEXXO_LOCAL_OPEN_BANKING_SYNC_MAX_ATTEMPTS:-5}
    OPEN_BANKING_SYNC_MAX_PAGES: ${VEXXO_LOCAL_OPEN_BANKING_SYNC_MAX_PAGES:-100}
    OPEN_BANKING_RETRY_BASE_SECONDS: ${VEXXO_LOCAL_OPEN_BANKING_RETRY_BASE_SECONDS:-30}
    OPEN_BANKING_RETRY_MAX_SECONDS: ${VEXXO_LOCAL_OPEN_BANKING_RETRY_MAX_SECONDS:-3600}
    REPORT_EXPORT_DOWNLOADED_RETENTION_HOURS: ${VEXXO_LOCAL_REPORT_EXPORT_DOWNLOADED_RETENTION_HOURS:-24}
    PAYMENTS_LOCAL_FAKE_ENABLED: ${VEXXO_LOCAL_PAYMENTS_LOCAL_FAKE_ENABLED:-true}
    DEFAULT_FROM_EMAIL: ${VEXXO_LOCAL_DEFAULT_FROM_EMAIL:-no-reply@vexxo.local}
    EMAIL_BACKEND: ${VEXXO_LOCAL_EMAIL_BACKEND:-django.core.mail.backends.filebased.EmailBackend}
    EMAIL_FILE_PATH: /app/.runtime/messages/email
    MEDIA_ROOT: /app/.runtime/media
    MEDIA_URL: /media/
    DOCUMENTS_MAX_UPLOAD_BYTES: ${VEXXO_LOCAL_DOCUMENTS_MAX_UPLOAD_BYTES:-10485760}
    PAYMENT_CALLBACK_SECRET: ${VEXXO_LOCAL_PAYMENT_CALLBACK_SECRET:-}
    WOMPI_CALLBACK_SECRET: ${VEXXO_LOCAL_WOMPI_CALLBACK_SECRET:-}
    WOMPI_BASE_URL: ${VEXXO_LOCAL_WOMPI_BASE_URL:-https://sandbox.wompi.co/v1}
    WOMPI_PRIVATE_KEY: ${VEXXO_LOCAL_WOMPI_PRIVATE_KEY:-}
    WOMPI_INTEGRITY_SECRET: ${VEXXO_LOCAL_WOMPI_INTEGRITY_SECRET:-}
    WOMPI_EVENTS_SECRET: ${VEXXO_LOCAL_WOMPI_EVENTS_SECRET:-}
    OPEN_BANKING_LOCAL_MOCK_WEBHOOK_SECRET: ${VEXXO_LOCAL_OPEN_BANKING_LOCAL_MOCK_WEBHOOK_SECRET:-}
    OPEN_BANKING_BELVO_CLIENT_ID: ${VEXXO_LOCAL_OPEN_BANKING_BELVO_CLIENT_ID:-}
    OPEN_BANKING_BELVO_CLIENT_SECRET: ${VEXXO_LOCAL_OPEN_BANKING_BELVO_CLIENT_SECRET:-}
    OPEN_BANKING_BELVO_WEBHOOK_AUTHORIZATION: ${VEXXO_LOCAL_OPEN_BANKING_BELVO_WEBHOOK_AUTHORIZATION:-}
    OPEN_BANKING_BELVO_CERTIFIED: ${VEXXO_LOCAL_OPEN_BANKING_BELVO_CERTIFIED:-false}
    OPEN_BANKING_BELVO_OFFICIAL_FIXTURE_PATH: ${VEXXO_LOCAL_OPEN_BANKING_BELVO_OFFICIAL_FIXTURE_PATH:-}
    OPEN_BANKING_BELVO_OFFICIAL_FIXTURE_SHA256: ${VEXXO_LOCAL_OPEN_BANKING_BELVO_OFFICIAL_FIXTURE_SHA256:-}
    PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER: ${VEXXO_LOCAL_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER:-}
    PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON: ${VEXXO_LOCAL_PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON:-}
    PLAY_INTEGRITY_PACKAGE_NAMES: ${VEXXO_LOCAL_PLAY_INTEGRITY_PACKAGE_NAMES:-}
    APPLE_APP_ATTEST_APP_ID: ${VEXXO_LOCAL_APPLE_APP_ATTEST_APP_ID:-}
    APPLE_APP_ATTEST_ROOT_CA_PEM: ${VEXXO_LOCAL_APPLE_APP_ATTEST_ROOT_CA_PEM:-}
    APPLE_APP_ATTEST_ENVIRONMENT: ${VEXXO_LOCAL_APPLE_APP_ATTEST_ENVIRONMENT:-development}
    DEVICE_ATTESTATION_VALIDITY_DAYS: ${VEXXO_LOCAL_DEVICE_ATTESTATION_VALIDITY_DAYS:-30}
    DEVICE_ATTESTATION_FAILURE_THRESHOLD: ${VEXXO_LOCAL_DEVICE_ATTESTATION_FAILURE_THRESHOLD:-3}
    SECURITY_AUDIT_INFO_RETENTION_DAYS: ${VEXXO_LOCAL_SECURITY_AUDIT_INFO_RETENTION_DAYS:-365}
    SECURITY_AUDIT_WARNING_RETENTION_DAYS: ${VEXXO_LOCAL_SECURITY_AUDIT_WARNING_RETENTION_DAYS:-730}
    SECURITY_AUDIT_CRITICAL_RETENTION_DAYS: ${VEXXO_LOCAL_SECURITY_AUDIT_CRITICAL_RETENTION_DAYS:-2555}
    SECURITY_THROTTLE_RETENTION_DAYS: ${VEXXO_LOCAL_SECURITY_THROTTLE_RETENTION_DAYS:-30}
    SECURITY_CHALLENGE_RETENTION_DAYS: ${VEXXO_LOCAL_SECURITY_CHALLENGE_RETENTION_DAYS:-30}
    OPEN_BANKING_SALT_EDGE_APP_ID: ${VEXXO_LOCAL_OPEN_BANKING_SALT_EDGE_APP_ID:-}
    OPEN_BANKING_SALT_EDGE_SECRET: ${VEXXO_LOCAL_OPEN_BANKING_SALT_EDGE_SECRET:-}
    OPEN_BANKING_SALT_EDGE_CALLBACK_PUBLIC_KEY: ${VEXXO_LOCAL_OPEN_BANKING_SALT_EDGE_CALLBACK_PUBLIC_KEY:-}
    OPEN_BANKING_SALT_EDGE_CERTIFIED: ${VEXXO_LOCAL_OPEN_BANKING_SALT_EDGE_CERTIFIED:-false}
    OPEN_BANKING_SALT_EDGE_OFFICIAL_FIXTURE_PATH: ${VEXXO_LOCAL_OPEN_BANKING_SALT_EDGE_OFFICIAL_FIXTURE_PATH:-}
    OPEN_BANKING_SALT_EDGE_OFFICIAL_FIXTURE_SHA256: ${VEXXO_LOCAL_OPEN_BANKING_SALT_EDGE_OFFICIAL_FIXTURE_SHA256:-}
    DOMAIN_EVENTS_LOCAL_AUTOPUBLISH_ENABLED: "false"
    DOMAIN_EVENTS_PUBSUB_ENABLED: "false"
    ASYNC_EXECUTION_MODE_ACCOUNTS_SYNC: local_worker
    ASYNC_EXECUTION_MODE_ACCOUNTS_INTELLIGENCE: local_worker
    ASYNC_EXECUTION_MODE_ALERTS_AI: local_worker
    ASYNC_EXECUTION_MODE_TRANSACTIONS_VOICE: local_worker
    ASYNC_EXECUTION_MODE_IDENTITY_CONSENTS: sync_inline_for_tests
    ACCOUNTS_SYNC_CLOUD_TASKS_ENABLED: "false"
    ACCOUNTS_INTELLIGENCE_CLOUD_TASKS_ENABLED: "false"
    ALERTS_AI_CLOUD_TASKS_ENABLED: "false"
    TRANSACTION_INFERENCE_CLOUD_TASKS_ENABLED: "false"
    IDENTITY_CONSENT_CLOUD_TASKS_ENABLED: "false"
    AI_DEFAULT_PROVIDER: ${VEXXO_LOCAL_AI_DEFAULT_PROVIDER:-stub}
    AI_EMBEDDING_PROVIDER: ${VEXXO_LOCAL_AI_EMBEDDING_PROVIDER:-stub}
    AI_DEEP_INFERENCE_PROVIDER: ${VEXXO_LOCAL_AI_DEEP_INFERENCE_PROVIDER:-stub}
    AI_LM_STUDIO_BASE_URL: ${VEXXO_LOCAL_AI_LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    AI_LM_STUDIO_MODEL: ${VEXXO_LOCAL_AI_LM_STUDIO_MODEL:-}

services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=${VEXXO_LOCAL_DB_MAX_CONNECTIONS:-100}"]
    restart: unless-stopped
    ports:
      - "${VEXXO_LOCAL_DB_PORT_HOST:-54329}:5432"
    environment:
      POSTGRES_DB: ${VEXXO_LOCAL_DB_NAME:-vexxo}
      POSTGRES_USER: ${VEXXO_LOCAL_DB_USER:-vexxo}
      POSTGRES_PASSWORD: ${VEXXO_LOCAL_DB_PASSWORD:-vexxo-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VEXXO_LOCAL_DB_USER:-vexxo} -d ${VEXXO_LOCAL_DB_NAME:-vexxo}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - vexxo_local_postgres:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -s /run/secrets/local_ca ]; then
          marker=$$(sed -n '2p' /run/secrets/local_ca)
          grep -qF "$$marker" /etc/ssl/certs/ca-certificates.crt || cat /run/secrets/local_ca >> /etc/ssl/certs/ca-certificates.crt
        fi
        exec /init
    ports:
      - "${VEXXO_LOCAL_CLAMAV_PORT_HOST:-3310}:3310"
    secrets:
      - local_ca
    volumes:
      - vexxo_local_clamav:/var/lib/clamav

  migrate:
    <<: *backend-common
    command: ["python", "manage.py", "migrate", "--noinput"]

  api:
    <<: *backend-common
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
    ports:
      - "${VEXXO_LOCAL_API_PORT_HOST:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5

  identity-outbox:
    <<: *backend-common
    command: ["python", "manage.py", "publish_outbox", "identity", "--loop", "--sleep-seconds", "5"]

  accounts-outbox:
    <<: *backend-common
    command: ["python", "manage.py", "publish_outbox", "accounts", "--loop", "--sleep-seconds", "5"]

  accounts-sync-worker:
    <<: *backend-common
    command: ["python", "manage.py", "run_worker", "accounts.sync", "--loop", "--sleep-seconds", "5"]

  accounts-intelligence-worker:
    <<: *backend-common
    command: ["python", "manage.py", "run_worker", "accounts.intelligence", "--loop", "--sleep-seconds", "5"]

  alerts-outbox:
    <<: *backend-common
    command: ["python", "manage.py", "publish_outbox", "alerts", "--loop", "--sleep-seconds", "5"]

  alerts-ai-worker:
    <<: *backend-common
    command: ["python", "manage.py", "run_worker", "alerts.ai", "--loop", "--sleep-seconds", "5"]

  transactions-outbox:
    <<: *backend-common
    command: ["python", "manage.py", "publish_outbox", "transactions", "--loop", "--sleep-seconds", "5"]

  transactions-voice-worker:
    <<: *backend-common
    command: ["python", "manage.py", "run_worker", "transactions.voice", "--loop", "--sleep-seconds", "5"]

  documents-ocr-worker:
    <<: *backend-common
    command: ["python", "manage.py", "run_worker", "documents.ocr", "--loop", "--sleep-seconds", "5"]

  payments-outbox:
    <<: *backend-common
    command: ["python", "manage.py", "publish_outbox", "payments", "--loop", "--sleep-seconds", "5"]

  domain-outbox:
    <<: *backend-common
    command: ["python", "manage.py", "publish_outbox", "debts,goals,documents", "--loop", "--sleep-seconds", "5"]

  scheduler-local:
    <<: *backend-common
    command: ["python", "manage.py", "run_scheduler", "--loop", "--sleep-seconds", "15"]
    restart: unless-stopped

volumes:
  vexxo_local_postgres:
  vexxo_local_runtime:
  vexxo_local_clamav:

secrets:
  local_ca:
    file: ${VEXXO_LOCAL_CA_CERT_PATH:-.runtime/docker/local-ca.crt}
