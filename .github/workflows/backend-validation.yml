name: Backend Validation

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-cloud.txt ]; then pip install -r requirements-cloud.txt; fi

      - name: Compile Python sources
        run: |
          python -m compileall backend common finance identity integrations_stub notifications realtime support

      - name: Django system check
        env:
          ENV: local
          DEBUG: "False"
          DJANGO_SECRET_KEY: ci-secret-key
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: db.sqlite3
          DB_USER: ""
          DB_PASSWORD: ""
          DB_HOST: ""
          DB_PORT: ""
        run: |
          python manage.py check
